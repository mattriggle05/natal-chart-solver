[package]
name = "ephemeris-lab"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[features]
default = []
baseline = ["dep:natal-chart-solver"]
[dependencies]
astro = "=2.0.0"
wasm-bindgen = "=0.2.114"
natal-chart-solver = { path = "../../../crate", optional = true }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
